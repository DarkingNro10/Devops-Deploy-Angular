<section class="page-container animate-fade-in">
  <div class="page-header">
    <h1 class="page-title">My <span class="accent-dev">Projects</span></h1>
    <p class="page-subtitle">Building the future, one line of code at a time.</p>
  </div>

  <div class="projects-grid">
    @for (project of projects; track $index) {
      <div class="project-card glass-panel">
        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          
          <div class="tech-stack">
            @for (tech of project.tech; track $index) {
              <span class="tech-badge">{{ tech }}</span>
            }
          </div>
        </div>
        <div class="project-footer">
          <a [href]="project.link" class="btn-link">View Project &rarr;</a>
        </div>
      </div>
    }
  </div>
</section>
